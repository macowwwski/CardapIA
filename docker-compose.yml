services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cardapia
      POSTGRES_PASSWORD: cardapia
      POSTGRES_DB: cardapia
    ports:
      - "${DB_PORT:-5433}:5432"     # Host na 5433 porque o container do AdptWrt está na 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cardapia_qdrant
    restart: always
    ports:
      - "6333:6333"   # Dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      
volumes:
  postgres_data:
  qdrant_data: