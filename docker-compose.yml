services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cardapia
      POSTGRES_PASSWORD: cardapia
      POSTGRES_DB: cardapia
    ports:
      - "5433:5432"     # Host na 5433 porque o container do AdptWrt está na 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: